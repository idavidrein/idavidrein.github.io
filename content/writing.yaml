# Single source of truth for the "writing & talks" list.
#
# build.py reads this to generate /writing.html (searchable, filterable)
# and to inject the curated list on the homepage (between the
# WRITING:START / WRITING:END markers in index.html).
#
# Fields per entry:
#   title        required
#   url          required. Internal links start with "/" (open in-tab);
#                anything else is treated as external (opens in a new tab).
#   date         required. Either YYYY-MM-DD or just YYYY when the exact
#                day is unknown. Only the year is ever displayed; the full
#                date (when given) is used for sorting within a year.
#   type         required. One of: essay | external | talk | podcast
#                  essay    = a post hosted here under /posts/
#                  external = writing published elsewhere (METR, Epoch, ...)
#                  talk     = a recorded talk / presentation
#                  podcast  = a podcast / interview appearance
#   tags         optional list of short lowercase tags (used by search +
#                the clickable tag filters on /writing.html)
#   description  required. One sentence, shown under the title.
#   featured     optional bool. Featured entries make up the curated list
#                on the homepage (most recent first, capped at 5).
#
# Order here does not matter; the build sorts by date, newest first.

